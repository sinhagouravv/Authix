<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authix SDK - God Tier Button Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-effect {
            animation: shimmer 2s infinite linear;
        }
    </style>
</head>
<body class="bg-[#f0f4f8] min-h-screen flex items-center justify-center p-8">
    <div id="root"></div>

    <script type="text/babel">
        const ShieldIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        );

        const ChevronIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m9 18 6-6-6-6"/>
            </svg>
        );

        const Enable3FAButton = () => {
            return (
                <div className="bg-white flex flex-col items-center gap-10 max-w-lg w-full">
                    <button
                        className="
                            group relative flex items-center gap-4 px-10 py-5 
                            bg-[#052558] text-white rounded-2xl font-bold text-[14px] 
                            uppercase tracking-[0.2em] shadow-[0_20px_50px_rgba(5,37,88,0.3)]
                            transition-all duration-500 hover:bg-[#0a3a8a] 
                            hover:shadow-[0_25px_60px_rgba(5,37,88,0.4)] hover:-translate-y-1 active:scale-[0.96]
                            overflow-hidden
                        "
                    >

                        <span className="relative z-10 font-bold">Enable 3FA</span>

                        

                        {/* Subtle Border Glow */}
                        <div className="absolute inset-px rounded-[15px] border border-white/10 group-hover:border-white/25 transition-colors duration-500 pointer-events-none" />
                    </button>

                </div>
            );
        };

        const App = () => {
            return (
                <div className="animate-in fade-in zoom-in duration-700">
                    <Enable3FAButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
