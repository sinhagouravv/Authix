<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authix 3FA Developer Kit Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-ring {
            animation: pulse-ring 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12 selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ShieldIcon = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        );

        const SmartphoneIcon = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
                <path d="M12 18h.01"/>
            </svg>
        );

        const KeyIcon = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m21 2-2 2m-1.5 1.5L16 7l-2-2-1.5 1.5"/>
                <circle cx="7.5" cy="15.5" r="5.5"/>
            </svg>
        );

        const ArrowRightIcon = ({ size = 18, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M5 12h14m-7-7 7 7-7 7"/>
            </svg>
        );

        const CheckCircleIcon = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        );

        const PROD_API = 'https://authix-5nkr.onrender.com/api';
        const LOCAL_API = 'http://localhost:5002/api';
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? LOCAL_API : PROD_API;

        const App = () => {
            const [activeTab, setActiveTab] = useState('interactive');
            const [challengeStatus, setChallengeStatus] = useState('IDLE');
            const [requestId, setRequestId] = useState(null);
            const [totpCode, setTotpCode] = useState('');
            const [logs, setLogs] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [userEmail, setUserEmail] = useState('developer@authix.io');
            const pollIntervalRef = useRef(null);

            const addLog = (msg, type = 'info') => {
                const time = new Date().toLocaleTimeString();
                setLogs(prev => [{ time, msg, type, id: Math.random() }, ...prev]);
            };

            const startVerification = async () => {
                setIsLoading(true);
                addLog('Initiating Factor 1 & generating 3FA challenge...', 'info');
                try {
                    const res = await fetch(`${API_BASE_URL}/start-verification`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            clientId: 'authix_cli_demo_preview',
                            userId: 'user_dev_88',
                            userEmail: userEmail,
                            action: 'SDK_PREVIEW_TEST'
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setRequestId(data.requestId);
                        setChallengeStatus('WAITING_TOTP');
                        setIsModalOpen(true);
                        addLog(`Challenge created! Request ID: ${data.requestId}`, 'success');
                        startStatusPolling(data.requestId);
                    } else {
                        addLog(`Error: ${data.error}`, 'error');
                    }
                } catch (e) {
                    addLog(`Backend unreachable on ${API_BASE_URL}. If running locally, make sure dev:server is started.`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const submitTOTP = async (e) => {
                e && e.preventDefault();
                if (!requestId || totpCode.length !== 6) return;
                setIsLoading(true);
                addLog(`Submitting Factor 2 (TOTP: ${totpCode})...`, 'info');
                try {
                    const res = await fetch(`${API_BASE_URL}/verify-totp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            clientId: 'authix_cli_demo_preview',
                            requestId: requestId,
                            token: totpCode
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setChallengeStatus('WAITING_MOBILE_APPROVAL');
                        addLog(`Factor 2 Verified! Now awaiting Factor 3 (Mobile Biometric Push)...`, 'success');
                    } else {
                        addLog(`TOTP verification failed: ${data.error}`, 'error');
                    }
                } catch (err) {
                    addLog(`Error verifying TOTP: ${err.message}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const simulateMobileBiometricApproval = async () => {
                if (!requestId) return;
                setIsLoading(true);
                addLog('Simulating customer mobile TouchID / FaceID biometric approval...', 'info');
                try {
                    const res = await fetch(`${API_BASE_URL}/mobile/approve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            requestId: requestId,
                            biometricProof: 'PASSKEY_SECURE_ENCLAVE_SIGNATURE_OK',
                            deviceId: 'iPhone 15 Pro (Preview)'
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setChallengeStatus('VERIFIED');
                        addLog('Factor 3 Verified! Handshake complete.', 'success');
                    }
                } catch (err) {
                    addLog(`Simulator error: ${err.message}`, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const startStatusPolling = (reqId) => {
                if (pollIntervalRef.current) clearInterval(pollIntervalRef.current);
                pollIntervalRef.current = setInterval(async () => {
                    try {
                        const res = await fetch(`${API_BASE_URL}/check-status?requestId=${reqId}`);
                        const data = await res.json();
                        if (data.status === 'VERIFIED') {
                            setChallengeStatus('VERIFIED');
                            clearInterval(pollIntervalRef.current);
                        } else if (data.status === 'FAILED' || data.status === 'EXPIRED') {
                            setChallengeStatus(data.status);
                            clearInterval(pollIntervalRef.current);
                        }
                    } catch (e) {}
                }, 1500);
            };

            useEffect(() => {
                return () => {
                    if (pollIntervalRef.current) clearInterval(pollIntervalRef.current);
                };
            }, []);

            return (
                <div className="max-w-6xl mx-auto space-y-10">
                    {/* Top Bar */}
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-2xl">
                                <ShieldIcon size={28} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                                    Authix <span className="bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">SDK Preview</span>
                                </h1>
                                <p className="text-xs text-slate-400">Interactive 3-Factor Authentication Testbed & Component Studio</p>
                            </div>
                        </div>

                        {/* Security Badge Preview */}
                        <div className="flex items-center gap-2 px-3.5 py-1.5 bg-slate-900 border border-slate-800 rounded-full text-xs font-semibold">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span>Protected by <strong className="text-blue-400">Authix 3FA</strong></span>
                        </div>
                    </div>

                    {/* Main Layout Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Left Column: Interactive Simulation */}
                        <div className="lg:col-span-7 space-y-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 space-y-6">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        <span>3FA Interactive Challenge</span>
                                    </h2>
                                    <span className={`text-[11px] font-mono uppercase tracking-widest px-2.5 py-1 rounded-full border ${
                                        challengeStatus === 'VERIFIED' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                                        challengeStatus === 'WAITING_MOBILE_APPROVAL' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30 animate-pulse' :
                                        challengeStatus === 'WAITING_TOTP' ? 'bg-blue-500/10 text-blue-400 border-blue-500/30' :
                                        'bg-slate-800 text-slate-400 border-slate-700'
                                    }`}>
                                        Status: {challengeStatus}
                                    </span>
                                </div>

                                {/* Step Progress Bar */}
                                <div className="grid grid-cols-3 gap-3">
                                    <div className="p-3 bg-slate-800/80 border border-emerald-500/30 rounded-2xl flex flex-col items-center gap-1.5 text-center">
                                        <div className="p-1.5 bg-emerald-500/20 text-emerald-400 rounded-full">
                                            <CheckCircleIcon size={16} />
                                        </div>
                                        <span className="text-xs font-bold text-emerald-400">1. Password</span>
                                        <span className="text-[10px] text-slate-400">Primary Credential</span>
                                    </div>
                                    <div className={`p-3 rounded-2xl flex flex-col items-center gap-1.5 text-center transition-all ${
                                        challengeStatus === 'WAITING_TOTP' ? 'bg-blue-500/10 border-2 border-blue-500 text-blue-400 font-bold' :
                                        challengeStatus === 'WAITING_MOBILE_APPROVAL' || challengeStatus === 'VERIFIED' ? 'bg-slate-800/80 border border-emerald-500/30 text-emerald-400' :
                                        'bg-slate-800/40 border border-slate-800 text-slate-500'
                                    }`}>
                                        <div className="p-1.5 bg-blue-500/20 text-blue-400 rounded-full">
                                            <KeyIcon size={16} />
                                        </div>
                                        <span className="text-xs font-bold">2. TOTP Code</span>
                                        <span className="text-[10px] text-slate-400">Possession Factor</span>
                                    </div>
                                    <div className={`p-3 rounded-2xl flex flex-col items-center gap-1.5 text-center transition-all ${
                                        challengeStatus === 'WAITING_MOBILE_APPROVAL' ? 'bg-amber-500/10 border-2 border-amber-500 text-amber-400 font-bold animate-pulse' :
                                        challengeStatus === 'VERIFIED' ? 'bg-slate-800/80 border border-emerald-500/30 text-emerald-400' :
                                        'bg-slate-800/40 border border-slate-800 text-slate-500'
                                    }`}>
                                        <div className="p-1.5 bg-amber-500/20 text-amber-400 rounded-full">
                                            <SmartphoneIcon size={16} />
                                        </div>
                                        <span className="text-xs font-bold">3. Mobile Push</span>
                                        <span className="text-[10px] text-slate-400">Biometric Factor</span>
                                    </div>
                                </div>

                                {/* Actions */}
                                <div className="space-y-4 pt-2">
                                    {challengeStatus === 'IDLE' && (
                                        <div className="space-y-3">
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-400">Test Account Email</label>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="email" 
                                                    value={userEmail} 
                                                    onChange={(e) => setUserEmail(e.target.value)} 
                                                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500"
                                                />
                                                <button
                                                    onClick={startVerification}
                                                    disabled={isLoading}
                                                    className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 font-bold text-sm rounded-xl transition flex items-center gap-2 shadow-lg shadow-blue-600/30"
                                                >
                                                    <ShieldIcon size={16} />
                                                    <span>Trigger 3FA Challenge</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {challengeStatus === 'WAITING_TOTP' && (
                                        <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-slate-300">Factor 2: Enter Authenticator Code</span>
                                                <button onClick={() => setTotpCode('123456')} className="text-[11px] text-blue-400 hover:underline">Use Demo Code (123456)</button>
                                            </div>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="text" 
                                                    maxLength="6"
                                                    value={totpCode}
                                                    placeholder="123456"
                                                    onChange={(e) => setTotpCode(e.target.value)}
                                                    className="w-44 text-center font-mono text-xl tracking-widest font-bold bg-slate-900 border border-slate-700 rounded-xl py-2 px-3 focus:outline-none focus:border-blue-500"
                                                />
                                                <button
                                                    onClick={submitTOTP}
                                                    disabled={isLoading || totpCode.length !== 6}
                                                    className="flex-1 py-2 px-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 font-bold text-sm rounded-xl transition"
                                                >
                                                    Verify Factor 2
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {challengeStatus === 'WAITING_MOBILE_APPROVAL' && (
                                        <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5 space-y-4 text-center">
                                            <div className="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto animate-bounce">
                                                <SmartphoneIcon size={24} />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-sm text-amber-300">Awaiting Factor 3 Biometric Approval</h4>
                                                <p className="text-xs text-slate-400 mt-1 max-w-sm mx-auto">
                                                    Check your phone or test the instant simulator below to trigger biometric approval.
                                                </p>
                                            </div>
                                            <button
                                                onClick={simulateMobileBiometricApproval}
                                                disabled={isLoading}
                                                className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20"
                                            >
                                                <CheckCircleIcon size={18} />
                                                <span>Simulate Mobile Biometric Passkey Approval</span>
                                            </button>
                                        </div>
                                    )}

                                    {challengeStatus === 'VERIFIED' && (
                                        <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-6 text-center space-y-3">
                                            <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto">
                                                <CheckCircleIcon size={32} />
                                            </div>
                                            <h3 className="text-base font-bold text-emerald-400">Full 3FA Handshake Verified!</h3>
                                            <p className="text-xs text-slate-400">Password + TOTP + Mobile Biometric factors all confirmed successfully.</p>
                                            <button
                                                onClick={() => {
                                                    setChallengeStatus('IDLE');
                                                    setRequestId(null);
                                                    setTotpCode('');
                                                }}
                                                className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl transition mt-2"
                                            >
                                                Reset Simulator
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Drop-in Buttons Showcase */}
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 space-y-4">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">Drop-in Button Variants (`Enable3FAButton`)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                                    <button className="flex items-center justify-center gap-3 px-6 py-3.5 bg-[#052558] hover:bg-[#0a3a8a] text-white rounded-2xl font-bold text-xs uppercase tracking-wider shadow-xl shadow-blue-950/30 transition">
                                        <ShieldIcon size={16} className="text-blue-400" />
                                        <span>Solid Variant</span>
                                        <ArrowRightIcon size={14} className="opacity-60" />
                                    </button>

                                    <button className="flex items-center justify-center gap-3 px-6 py-3.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-600 hover:opacity-90 text-white rounded-2xl font-bold text-xs uppercase tracking-wider shadow-[0_0_20px_rgba(59,130,246,0.3)] transition">
                                        <ShieldIcon size={16} />
                                        <span>Glow Variant</span>
                                        <ArrowRightIcon size={14} className="opacity-60" />
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Live Event Stream Log */}
                        <div className="lg:col-span-5 flex flex-col">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex-1 flex flex-col space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Live SDK Event Stream</h3>
                                    </div>
                                    <button onClick={() => setLogs([])} className="text-[11px] text-slate-500 hover:text-slate-300">Clear</button>
                                </div>

                                <div className="flex-1 overflow-y-auto max-h-[480px] space-y-2 font-mono text-xs pr-1">
                                    {logs.length === 0 ? (
                                        <div className="text-slate-600 text-center py-20">
                                            Logs will stream here in real-time as you test the 3FA flow.
                                        </div>
                                    ) : (
                                        logs.map((log) => (
                                            <div 
                                                key={log.id} 
                                                className={`p-2.5 rounded-xl border ${
                                                    log.type === 'success' ? 'bg-emerald-950/20 border-emerald-900/40 text-emerald-300' :
                                                    log.type === 'error' ? 'bg-rose-950/20 border-rose-900/40 text-rose-300' :
                                                    'bg-slate-950/40 border-slate-800/60 text-slate-300'
                                                }`}
                                            >
                                                <span className="text-slate-500 text-[10px] mr-2">[{log.time}]</span>
                                                <span>{log.msg}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
